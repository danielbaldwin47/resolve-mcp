[project]
name = "resolve-mcp"
dynamic = ["version"]
description = "MCP server that gives Claude Code hands inside DaVinci Resolve Studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=3.4,<4",
    # The analysis substrate: numpy does the arithmetic, scipy the IIR filtering the
    # loudness standard needs. Both are imported inside workers, never at startup.
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
# The analysis backends: heavy, GPU-bound, and imported inside the workers that need them.
# Kept out of the base install so the server (and CI, which runs the fake tier) does not
# pull a CUDA runtime to answer get_status.
analysis = [
    "faster-whisper>=1.0",
    # The CUDA 12 runtime CTranslate2 links against (~1.3 GiB). Shipped in the extra rather
    # than left to the machine because the device default is "auto": CTranslate2 picks CUDA
    # the moment it sees an NVIDIA card, and then needs a runtime nothing else in this tree
    # provides — so the extra used to fail on exactly the boxes it is most useful on (#128).
    # No wheels exist for macOS, and nothing there would use them.
    "nvidia-cublas-cu12>=12,<13; platform_system != 'Darwin'",
    "nvidia-cudnn-cu12>=9,<10; platform_system != 'Darwin'",
    # The music stack (#37): beat_this for the beat grid, PANNs for the applause curve,
    # torchcodec + soundfile for decode. ADR 0002 injects these at seams, so no test tier
    # can see this stack break — the fakes stay green while real inference is dead at
    # import. The receipt that the installed stack works is
    # `uv run pytest tests/test_live_analysis.py -m live`.
    # beat_this has no PyPI release; pinned to the commit the corpus was measured with.
    "beat-this @ git+https://github.com/CPJKU/beat_this@b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c",
    # torchcodec minors pair with torch minors (0.15 <-> 2.13); move them together or decode
    # dies at import. The pins are the ones the corpus was measured with and did not move in
    # #245 — only the *build* did, via [tool.uv.sources] below: on Windows PyPI ships the CPU
    # wheel, so these three come off the cu130 index instead.
    "torch>=2.13,<2.14",
    "torchcodec>=0.15,<0.16",
    # beat_this pulls torchaudio unpinned, and it pairs with torch minors the same way
    # (2.11 <-> 2.13 is the measured combination) — pinned here beside torch for the same
    # reason torchcodec is.
    "torchaudio>=2.11,<2.12",
    "soundfile>=0.14",
    # panns_inference fetches its weights via os.system('wget ...'), absent on Windows:
    # hand-place class_labels_indices.csv + Cnn14_DecisionLevelMax.pth (327 MB) in
    # ~/panns_data/ — see README "Requirements".
    "panns-inference>=0.1",
]

[project.scripts]
resolve-mcp = "resolve_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/resolve_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_mcp"]

[tool.hatch.metadata]
# The analysis extra carries beat_this as a git direct reference (no PyPI release exists);
# hatchling refuses to build metadata containing direct references without this.
allow-direct-references = true

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
# numba refuses numpy >= 2.5 outright ("Numba needs NumPy 2.4 or less"), and numba arrives
# transitively on any box that injects the analysis models: panns_inference -> torchlibrosa ->
# librosa -> numba. Without this, `uv sync` resolves numpy 2.5 and PANNs inference dies at import
# while the whole fake tier stays green, because ADR 0002 injects the models rather than depending
# on them. Constrained here rather than in [project.dependencies] so the cap governs this
# environment without shipping in the published metadata: nothing the server itself imports has
# this ceiling, only the injected analysis stack does.
# numba 0.66.0 is the latest stable as of 2026-08; when 0.67 ships stable it likely lifts the
# ceiling and this block can go.
constraint-dependencies = ["numpy<2.5"]

# The CUDA wheels for the beat grid and the applause curve (#245). PyPI's torch is one
# wheel per platform and only the **Windows** one is CPU-only (122 MB, no CUDA runtime);
# the Linux wheel already depends on `nvidia-*-cu13` and is the CUDA build. So the index
# is mapped for `win32` alone: the live box gets `+cu130`, and a Linux/CI resolve is left
# exactly as it was — no Windows-only wheels dragged into a universal lock, and no card
# needed to resolve or import (ADR 0002 injects the models; the fake tier never loads
# torch).
#
# cu130 is the index, not a floor: the live box's driver is CUDA 13.3, and it is the
# highest index carrying all three pinned minors as cp312 win_amd64 — torch 2.13.0,
# torchaudio 2.11.0 (its last release; torchaudio stopped there), torchcodec 0.15.0.
# When a pin moves, check the same index for all three before moving any of them:
# `pip index versions torch --index-url https://download.pytorch.org/whl/cu130`.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchcodec = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: exercises a running DaVinci Resolve Studio; not part of the default suite",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One-off gauntlet recon scripts: documentary artifacts of the gauntlet loop;
# long literal paths and printf lines stay as run.
"gauntlet/recon/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true

# The analysis extras ship no stubs, and are not installed at all in CI or on a machine
# that only drives Resolve — so the imports are unresolvable rather than untyped. scipy
# ships no type information either; the two functions used from it are filters over arrays.
# torch does ship types, so a box with the analysis extra typechecks it for real; the
# override only quiets CI, where analysis/device.py's guarded import has nothing to resolve.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "scipy.*", "torch.*"]
ignore_missing_imports = true
