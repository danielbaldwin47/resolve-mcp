[project]
name = "resolve-mcp"
dynamic = ["version"]
description = "MCP server that gives Claude Code hands inside DaVinci Resolve Studio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=3.4,<4",
]

[project.scripts]
resolve-mcp = "resolve_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/resolve_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: exercises a running DaVinci Resolve Studio; not part of the default suite",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
