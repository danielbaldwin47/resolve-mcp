[project]
name = "resolve-mcp"
dynamic = ["version"]
description = "MCP server that gives Claude Code hands inside DaVinci Resolve Studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=3.4,<4",
    # The analysis substrate: numpy does the arithmetic, scipy the IIR filtering the
    # loudness standard needs. Both are imported inside workers, never at startup.
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
]

[project.scripts]
resolve-mcp = "resolve_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/resolve_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: exercises a running DaVinci Resolve Studio; not part of the default suite",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# scipy ships no type information; the two functions used from it are filters over arrays.
module = ["scipy.*"]
ignore_missing_imports = true
