[project]
name = "resolve-mcp"
dynamic = ["version"]
description = "MCP server that gives Claude Code hands inside DaVinci Resolve Studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=3.4,<4",
    # The analysis substrate: numpy does the arithmetic, scipy the IIR filtering the
    # loudness standard needs. Both are imported inside workers, never at startup.
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
# The analysis backends: heavy, GPU-bound, and imported inside the workers that need them.
# Kept out of the base install so the server (and CI, which runs the fake tier) does not
# pull a CUDA runtime to answer get_status.
analysis = [
    "faster-whisper>=1.0",
]

[project.scripts]
resolve-mcp = "resolve_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/resolve_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
# numba refuses numpy >= 2.5 outright ("Numba needs NumPy 2.4 or less"), and numba arrives
# transitively on any box that injects the analysis models: panns_inference -> torchlibrosa ->
# librosa -> numba. Without this, `uv sync` resolves numpy 2.5 and PANNs inference dies at import
# while the whole fake tier stays green, because ADR 0002 injects the models rather than depending
# on them. Constrained here rather than in [project.dependencies] so the cap governs this
# environment without shipping in the published metadata: the server itself is fine on numpy 2.5.
# numba 0.66.0 is the latest stable as of 2026-08; when 0.67 ships stable it likely lifts the
# ceiling and this block can go.
constraint-dependencies = ["numpy<2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: exercises a running DaVinci Resolve Studio; not part of the default suite",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true

# The analysis extras ship no stubs, and are not installed at all in CI or on a machine
# that only drives Resolve — so the imports are unresolvable rather than untyped. scipy
# ships no type information either; the two functions used from it are filters over arrays.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "scipy.*"]
ignore_missing_imports = true
